<!--
  Okidoc app icon — master artwork (1024 × 1024, full bleed, no transparency).
  Mark: a magnifier ("find your doctor") whose lens holds a heartbeat line ("live queue").
  Rendered to: iOS AppIcon, Play Store 512, Android legacy launcher icons, in-app logo.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.5" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0A766C"/>
    </linearGradient>
    <radialGradient id="hl" cx="0.22" cy="0.16" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- shadow values are in glyph units (the glyph group is scaled ×14.2) -->
    <filter id="sh" filterUnits="userSpaceOnUse" x="-40" y="-40" width="144" height="144">
      <feDropShadow dx="0" dy="1.1" stdDeviation="1.3" flood-color="#053B35" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#hl)"/>
  <!-- glyph drawn on a 64-unit grid, centred and scaled -->
  <g filter="url(#sh)" transform="translate(512 512) scale(14.2) translate(-32 -32)" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="29" cy="29" r="14" stroke-width="6"/>
    <path d="M39.6 39.6 L48.5 48.5" stroke-width="6.6"/>
    <path d="M20.5 29 h4.5 l2.2 -4.6 l4 9.2 l2.2 -4.6 h4.6" stroke-width="2.7"/>
  </g>
</svg>
