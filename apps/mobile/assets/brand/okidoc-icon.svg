<!--
  Okidoc app icon — master artwork (1024 × 1024, full bleed, no transparency).
  Mark: an open "O" ring (Okidoc, and the queue moving round) with an amber token dot in the gap ("your turn")
  around a medical cross ("care"). Rendered to: iOS AppIcon, Play Store 512, Android legacy launcher icons, in-app logo.
  The same glyph (64-unit grid) is used in android/.../drawable/ic_launcher_foreground.xml, ic_splash_logo.xml and
  apps/web/src/components/icons.tsx (BrandMark) / apps/web/src/app/icon.svg — keep them in step.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3EE6C8"/>
      <stop offset="0.45" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0B5A66"/>
    </linearGradient>
    <radialGradient id="hl" cx="0.2" cy="0.12" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD97A"/>
      <stop offset="1" stop-color="#FFB547"/>
    </linearGradient>
    <!-- shadow values are in glyph units (the glyph group is scaled ×16) -->
    <filter id="sh" filterUnits="userSpaceOnUse" x="-40" y="-40" width="144" height="144">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.4" flood-color="#04323A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#hl)"/>
  <!-- glyph drawn on a 64-unit grid, centred and scaled -->
  <g filter="url(#sh)" transform="translate(512 512) scale(16) translate(-32 -32)">
    <path d="M48.42 27.6A17 17 0 1 1 30.52 15.06" fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round"/>
    <circle cx="41.75" cy="18.07" r="5" fill="url(#dot)"/>
    <path fill="#FFFFFF" d="M29 26.7a2.2 2.2 0 0 1 2.2-2.2h1.6a2.2 2.2 0 0 1 2.2 2.2V29h2.3a2.2 2.2 0 0 1 2.2 2.2v1.6a2.2 2.2 0 0 1-2.2 2.2H35v2.3a2.2 2.2 0 0 1-2.2 2.2h-1.6a2.2 2.2 0 0 1-2.2-2.2V35h-2.3a2.2 2.2 0 0 1-2.2-2.2v-1.6a2.2 2.2 0 0 1 2.2-2.2H29z"/>
  </g>
</svg>
